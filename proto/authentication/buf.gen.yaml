version: v2
managed:
  enabled: true

plugins:
  # OpenAPI spec generation
  - remote: buf.build/community/sudorandom-connect-openapi
    out: ../../apps/default
    opt:
      - features=connectrpc;gnostic;protovalidate
      - content-types=json
      - allow-get

  # Dart protobuf generation. include_wkt keeps google/protobuf/descriptor
  # (buf/validate and gnostic import it). After each generate, delete the
  # other WKT copies under lib/src/google/protobuf: generated code imports
  # them from package:protobuf/well_known_types.
  - remote: buf.build/protocolbuffers/dart:v25.1.0
    out: ../../sdk/dart/authentication/lib/src
    include_imports: true
    include_wkt: true

  # Dart ConnectRPC generation
  - remote: buf.build/connectrpc/dart:v2.0.0
    out: ../../sdk/dart/authentication/lib/src
    include_imports: true
    include_wkt: true
