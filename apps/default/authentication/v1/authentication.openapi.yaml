openapi: 3.1.0
info:
  title: Authentication Service
  description: The Authentication Service provides read-only access to login history and session information. It exposes login events created during OAuth2 authentication flows, enabling users and administrators to review sign-in activity, device usage, and session details.
  contact:
    name: Ant Investor Ltd
    url: https://github.com/antinvestor/service-authentication
    email: info@antinvestor.com
  license:
    name: Apache License
    url: https://github.com/antinvestor/apis/blob/master/LICENSE
  version: v1.0.0
paths:
  /authentication.v1.AuthenticationService/GetLoginEvent:
    get:
      tags:
        - Authentication
        - authentication.v1.AuthenticationService
      summary: Get login event
      description: Retrieves a single login event by its unique identifier. Users can only view their own login events unless they have admin permissions.
      operationId: getLoginEvent
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
        - name: message
          in: query
          description: The URL-encoded message query parameter contains the JSON or binary serialized request message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authentication.v1.GetLoginEventRequest'
        - name: encoding
          in: query
          description: Define which encoding or 'Message-Codec' to use
          required: true
          schema:
            $ref: '#/components/schemas/encoding'
          example: json
        - name: base64
          in: query
          description: Specifies if the message query param is base64 encoded, which may be required for binary data
          schema:
            $ref: '#/components/schemas/base64'
          example: false
        - name: compression
          in: query
          description: Which compression algorithm to use for this request
          schema:
            $ref: '#/components/schemas/compression'
          example: gzip
        - name: connect
          in: query
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect'
          example: v1
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authentication.v1.GetLoginEventResponse'
    post:
      tags:
        - Authentication
        - authentication.v1.AuthenticationService
      summary: Get login event
      description: Retrieves a single login event by its unique identifier. Users can only view their own login events unless they have admin permissions.
      operationId: getLoginEvent2
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authentication.v1.GetLoginEventRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authentication.v1.GetLoginEventResponse'
  /authentication.v1.AuthenticationService/IssueGenesisSessionProof:
    post:
      tags:
        - GenesisSessionProof
        - authentication.v1.AuthenticationService
      summary: Issue genesis session proof
      description: Mints a genesis session proof bound to the caller's live session, device and the device key being registered.
      operationId: issueGenesisSessionProof
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authentication.v1.IssueGenesisSessionProofRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authentication.v1.IssueGenesisSessionProofResponse'
  /authentication.v1.AuthenticationService/ListLoginEvents: {}
  /authentication.v1.AuthenticationService/VerifyGenesisSessionProof:
    post:
      tags:
        - GenesisSessionProof
        - authentication.v1.AuthenticationService
      summary: Verify genesis session proof
      description: Verifies a genesis session proof against the expected profile, device and key, optionally spending its nonce.
      operationId: verifyGenesisSessionProof
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authentication.v1.VerifyGenesisSessionProofRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authentication.v1.VerifyGenesisSessionProofResponse'
components:
  schemas:
    authentication.v1.GenesisSessionProofClaims:
      type: object
      properties:
        version:
          type: string
          title: version
          description: Format version ("GSP1").
        keyId:
          type: string
          title: key_id
          description: Signing key id in /.well-known/genesis-session-proof-keys.json.
        algorithm:
          type: string
          title: algorithm
          description: Always "ed25519" for GSP1.
        profileId:
          type: string
          title: profile_id
          description: The person the proof is about (JWT sub === profile_id).
        deviceId:
          type: string
          title: device_id
          description: The device the live session ran on.
        pubkeyHash:
          type: string
          title: pubkey_hash
          description: Lowercase hex hash of the device public key being registered.
        deviceKeyId:
          type: string
          title: device_key_id
          description: Devices-service identifier of that key, when known.
        nonce:
          type: string
          title: nonce
          description: Single-use nonce.
        issuedAt:
          type: string
          title: issued_at
        expiresAt:
          type: string
          title: expires_at
        sessionId:
          type: string
          title: session_id
          description: The login event the proof was issued inside.
        tenantId:
          type: string
          title: tenant_id
        partitionId:
          type: string
          title: partition_id
        audience:
          type: string
          title: audience
          description: The consumer the proof is meant for.
      title: GenesisSessionProofClaims
      additionalProperties: false
      description: |-
        GenesisSessionProofClaims is the signed payload of a genesis session proof.
         The time fields are the exact claim text (RFC 3339 UTC with microseconds)
         because they are part of the signed binding pre-image.
    authentication.v1.GetLoginEventRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: GetLoginEventRequest
      additionalProperties: false
      description: GetLoginEventRequest retrieves a single login event by ID.
    authentication.v1.GetLoginEventResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/authentication.v1.LoginEventObject'
          title: data
      title: GetLoginEventResponse
      additionalProperties: false
    authentication.v1.IssueGenesisSessionProofRequest:
      type: object
      properties:
        pubkeyHash:
          type: string
          title: pubkey_hash
          pattern: ^[0-9a-fA-F]{64}$
          description: |-
            32-byte hex digest of the device public key being registered (on EVM,
             keccak256 of the device address). Normalised to lowercase.
        deviceKeyId:
          type: string
          title: device_key_id
          maxLength: 255
          description: Devices-service identifier of the key, when known.
        deviceId:
          type: string
          title: device_id
          maxLength: 255
          description: Optional; when set it must equal the session's device.
      title: IssueGenesisSessionProofRequest
      additionalProperties: false
      description: |-
        IssueGenesisSessionProofRequest asks for a proof bound to the caller's own
         live session and device. Profile, device and session come from the verified
         bearer token, never from the request.
    authentication.v1.IssueGenesisSessionProofResponse:
      type: object
      properties:
        token:
          type: string
          title: token
          description: |-
            The proof to present to the consumer (for example settlement's
             DeployAccount session_proof, as its UTF-8 bytes).
        keyId:
          type: string
          title: key_id
        algorithm:
          type: string
          title: algorithm
        nonce:
          type: string
          title: nonce
        issuedAt:
          type: string
          title: issued_at
        expiresAt:
          type: string
          title: expires_at
        bindingHash:
          type: string
          title: binding_hash
          description: Lowercase hex SHA-256 of the binding pre-image.
        audience:
          type: string
          title: audience
      title: IssueGenesisSessionProofResponse
      additionalProperties: false
    authentication.v1.ListLoginEventsRequest:
      type: object
      properties:
        profileId:
          type: string
          title: profile_id
          description: Filter by profile ID. Required for non-admin users.
        clientId:
          type: string
          title: client_id
          description: Filter by OAuth2 client ID.
        source:
          type: string
          title: source
          description: Filter by login source (e.g., "direct", "google").
        deviceId:
          type: string
          title: device_id
          description: Filter by device ID.
        startDate:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_date
          description: Filter events created after this timestamp.
        endDate:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_date
          description: Filter events created before this timestamp.
        count:
          type: integer
          title: count
          format: int32
          description: Maximum number of events per page. Default 50, max 500.
        page:
          type: string
          title: page
          description: Pagination cursor (ID of the last event from previous page).
      title: ListLoginEventsRequest
      additionalProperties: false
      description: ListLoginEventsRequest lists login events with filtering and pagination.
    authentication.v1.ListLoginEventsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/authentication.v1.LoginEventObject'
          title: data
      title: ListLoginEventsResponse
      additionalProperties: false
    authentication.v1.LoginEventObject:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Unique identifier for this login event.
        tenantId:
          type: string
          title: tenant_id
          description: Tenant context for multi-tenancy isolation.
        partitionId:
          type: string
          title: partition_id
          description: Partition context within the tenant.
        profileId:
          type: string
          title: profile_id
          description: Profile ID of the user who authenticated.
        clientId:
          type: string
          title: client_id
          description: OAuth2 client ID used for authentication.
        source:
          type: string
          title: source
          description: How the user authenticated.
        contactId:
          type: string
          title: contact_id
          description: Contact (email or phone) used for authentication.
        deviceId:
          type: string
          title: device_id
          description: Device ID from which the authentication occurred.
        ipAddress:
          type: string
          title: ip_address
          description: IP address of the authenticating client.
        userAgent:
          type: string
          title: user_agent
          description: User agent string of the authenticating client.
        status:
          type: integer
          title: status
          format: int32
          description: Login status code (0 = success).
        properties:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: properties
          description: Additional properties as structured data.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: Timestamp when the login event was created.
      title: LoginEventObject
      additionalProperties: false
      description: LoginEventObject represents a single completed authentication event.
    authentication.v1.LoginSource:
      type: string
      title: LoginSource
      enum:
        - LOGIN_SOURCE_UNSPECIFIED
        - LOGIN_SOURCE_DIRECT
        - LOGIN_SOURCE_GOOGLE
        - LOGIN_SOURCE_FACEBOOK
        - LOGIN_SOURCE_SERVICE_ACCOUNT
        - LOGIN_SOURCE_SESSION_REFRESH
      description: LoginSource identifies how a user authenticated.
    authentication.v1.VerifyGenesisSessionProofRequest:
      type: object
      properties:
        token:
          type: string
          title: token
          minLength: 1
        profileId:
          type: string
          title: profile_id
        deviceId:
          type: string
          title: device_id
        pubkeyHash:
          type: string
          title: pubkey_hash
        deviceKeyId:
          type: string
          title: device_key_id
        consume:
          type: boolean
          title: consume
          description: Spend the nonce. A consumer about to act on the proof sets it.
      title: VerifyGenesisSessionProofRequest
      additionalProperties: false
      description: |-
        VerifyGenesisSessionProofRequest checks a proof against what the consumer
         expects, and optionally spends its nonce. Empty expectations are not checked.
    authentication.v1.VerifyGenesisSessionProofResponse:
      type: object
      properties:
        valid:
          type: boolean
          title: valid
        reason:
          type: string
          title: reason
          description: Why the proof was refused, when it was.
        claims:
          allOf:
            - $ref: '#/components/schemas/authentication.v1.GenesisSessionProofClaims'
          title: claims
        bindingHash:
          type: string
          title: binding_hash
          description: Lowercase hex SHA-256 of the binding pre-image.
      title: VerifyGenesisSessionProofResponse
      additionalProperties: false
    base64:
      type: boolean
      examples:
        - false
      title: base64
      description: Specifies if the message query param is base64 encoded, which may be required for binary data
    compression:
      examples:
        - gzip
      title: compression
      enum:
        - identity
        - gzip
        - br
      description: Which compression algorithm to use for this request
    connect:
      examples:
        - v1
      title: connect
      enum:
        - v1
      description: Define the version of the Connect protocol
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    encoding:
      examples:
        - json
      title: encoding
      enum:
        - proto
        - json
      description: Define which encoding or 'Message-Codec' to use
    google.protobuf.ListValue:
      type: array
      items:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON array whose elements may be any JSON value.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        `NullValue` is a singleton enumeration to represent the null value for the
         `Value` type union.

         The JSON representation for `NullValue` is JSON `null`.
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON object whose property values may be any JSON value.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security: []
tags:
  - name: authentication.v1.AuthenticationService
    description: |-
      AuthenticationService provides read-only access to login history.
       All RPCs require authentication via Bearer token.
