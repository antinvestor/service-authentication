components:
  schemas:
    audit.v1.AuditCheckpoint:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        seq:
          type: string
          title: seq
          format: int64
        entryHash:
          type: string
          title: entry_hash
        keyId:
          type: string
          title: key_id
        signature:
          type: string
          title: signature
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: AuditCheckpoint
      additionalProperties: false
    audit.v1.AuditEntryObject:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Unique identifier for this audit entry.
        tenantId:
          type: string
          title: tenant_id
          description: Tenant context for multi-tenancy isolation.
        partitionId:
          type: string
          title: partition_id
          description: Partition context within the tenant.
        profileId:
          type: string
          title: profile_id
          description: Profile ID of the actor who performed the action.
        action:
          type: string
          title: action
          description: The action performed (e.g., "create", "update", "delete", "login", "grant_permission").
        resourceType:
          type: string
          title: resource_type
          description: Type of the resource affected (e.g., "partition", "service_account", "setting").
        resourceId:
          type: string
          title: resource_id
          description: Identifier of the affected resource.
        service:
          type: string
          title: service
          description: Originating service name (e.g., "service_tenancy", "service_profile").
        details:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: details
          description: Arbitrary details about the action as structured data.
        ipAddress:
          type: string
          title: ip_address
          description: IP address of the actor.
        userAgent:
          type: string
          title: user_agent
          description: User agent string of the actor's client.
        deviceId:
          type: string
          title: device_id
          description: Device ID from which the action was performed.
        targetProfileId:
          type: string
          title: target_profile_id
          description: Profile ID of the target user (if the action affects another user).
        traceId:
          type: string
          title: trace_id
          description: OpenTelemetry trace ID for request correlation.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: Timestamp when the action occurred.
        previousHash:
          type: string
          title: previous_hash
          description: SHA-256 hash of the previous entry in the chain (tamper-proof integrity).
        entryHash:
          type: string
          title: entry_hash
          description: SHA-256 hash of this entry's content including the previous hash.
        signature:
          type: string
          title: signature
          description: Ed25519 digital signature of the entry hash.
        seq:
          type: string
          title: seq
          format: int64
          description: Position of this entry in the tenant's chain (1-based, gap-free).
        keyId:
          type: string
          title: key_id
          description: Identifier of the signing key used for this entry.
        canonVersion:
          type: integer
          title: canon_version
          format: int32
          description: Canonical encoding version used to compute entry_hash (1 = legacy, 2 = length-prefixed).
        entryId:
          type: string
          title: entry_id
          description: Producer-supplied idempotency key, unique per (tenant, service).
        actorServiceAccountId:
          type: string
          title: actor_service_account_id
          description: Service account that submitted the entry (from caller claims).
        onBehalfOf:
          type: string
          title: on_behalf_of
          description: Person on whose behalf an operator or administrator acted.
        occurredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: occurred_at
          description: When the action happened at the producer.
        receivedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: received_at
          description: When the audit service accepted the entry.
        correlationId:
          type: string
          title: correlation_id
          description: Correlation identifier across services.
        eventId:
          type: string
          title: event_id
          description: Domain event identifier this action produced or relates to.
        intentId:
          type: string
          title: intent_id
          description: Financial intent identifier this action relates to.
        instanceId:
          type: string
          title: instance_id
          description: Workflow instance identifier this action relates to.
        payloadHash:
          type: string
          title: payload_hash
          description: SHA-256 hex of the request payload the person signed.
        authorizationHash:
          type: string
          title: authorization_hash
          description: SHA-256 hex of the authorization evidence record.
        policyHash:
          type: string
          title: policy_hash
          description: SHA-256 hex of the policy in force.
        deviceKeyId:
          type: string
          title: device_key_id
          description: Device key that signed the request, if any.
        stateFrom:
          type: string
          title: state_from
          description: State transition on the resource.
        stateTo:
          type: string
          title: state_to
        resourceVersion:
          type: string
          title: resource_version
          format: int64
          description: Version of the resource after the action.
        relations:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.AuditRelation'
          title: relations
          description: Relationships created, modified or removed by this action.
        manifestVersion:
          type: integer
          title: manifest_version
          format: int32
          description: Version of the producer's audit manifest the entry was validated against (0 = none).
        unmanifested:
          type: boolean
          title: unmanifested
          description: True when the producing service had no registered manifest at acceptance.
        state:
          allOf:
            - $ref: '#/components/schemas/audit.v1.IntakeState'
          title: state
          description: Intake state of the entry.
        phase:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditPhase'
          title: phase
          description: Phase of the command this entry records (GFOS §10.4, K11).
        outcomeOfEntryId:
          type: string
          title: outcome_of_entry_id
          description: entry_id of the REQUESTED entry this entry is the outcome of.
        auditClass:
          type: string
          title: audit_class
          description: Producer audit class in force for the RPC ("AUDIT_REQUIRED", ...).
        writtenDuringDegradation:
          type: boolean
          title: written_during_degradation
          description: |-
            True when the producer wrote this entry while AUDIT_DEGRADED was
             declared and drained it from its local outbox afterwards.
      title: AuditEntryObject
      additionalProperties: false
      description: |-
        AuditEntryObject represents a single audit trail entry.
         Entries are append-only and tamper-proof via hash chaining and digital signatures.
    audit.v1.AuditManifest:
      type: object
      properties:
        service:
          type: string
          title: service
          maxLength: 100
          minLength: 1
        actions:
          type: array
          items:
            type: string
          title: actions
          maxItems: 500
        resourceTypes:
          type: array
          items:
            type: string
          title: resource_types
          maxItems: 500
        openVocabulary:
          type: boolean
          title: open_vocabulary
          description: Accept any (action, resource_type) pair.
        allowBackdating:
          type: boolean
          title: allow_backdating
          description: Allow occurred_at older than the standard window (outbox replays).
        extraForbiddenKeys:
          type: array
          items:
            type: string
          title: extra_forbidden_keys
          maxItems: 100
          description: Additional forbidden detail keys (case-insensitive substrings).
      title: AuditManifest
      additionalProperties: false
      description: AuditManifest declares a producing service's audit vocabulary.
    audit.v1.AuditPhase:
      type: string
      title: AuditPhase
      enum:
        - AUDIT_PHASE_UNSPECIFIED
        - AUDIT_PHASE_REQUESTED
        - AUDIT_PHASE_COMPLETED
        - AUDIT_PHASE_FAILED
      description: |-
        AuditPhase links a human command to its outcome (GFOS §10.4, K11).
         A producer records REQUESTED before its own transaction and a linked
         COMPLETED or FAILED afterwards, so a REQUESTED entry with no outcome
         reads as "asked, not done". The service never infers completion.
    audit.v1.AuditRelation:
      type: object
      properties:
        parentType:
          type: string
          title: parent_type
        parentId:
          type: string
          title: parent_id
        childType:
          type: string
          title: child_type
        childId:
          type: string
          title: child_id
        action:
          type: string
          title: action
          description: '"added", "removed" or "modified".'
      title: AuditRelation
      additionalProperties: false
      description: AuditRelation is a link between two entities affected by an action.
    audit.v1.BatchCreateAuditEntriesRequest:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.CreateAuditEntryRequest'
          title: entries
          maxItems: 100
          minItems: 1
      title: BatchCreateAuditEntriesRequest
      additionalProperties: false
      description: BatchCreateAuditEntriesRequest creates multiple audit entries atomically.
    audit.v1.BatchCreateAuditEntriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.AuditEntryObject'
          title: data
          description: 'Deprecated: see CreateAuditEntryResponse.data.'
          deprecated: true
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.CreateAuditEntryResponse'
          title: receipts
          description: One receipt per request entry, in request order.
      title: BatchCreateAuditEntriesResponse
      additionalProperties: false
    audit.v1.CreateAuditEntryRequest:
      type: object
      properties:
        profileId:
          type: string
          title: profile_id
          minLength: 1
          description: Profile ID of the actor. Required.
        action:
          type: string
          title: action
          minLength: 1
          description: The action performed. Required.
        resourceType:
          type: string
          title: resource_type
          minLength: 1
          description: Type of the resource affected. Required.
        resourceId:
          type: string
          title: resource_id
          description: Identifier of the affected resource.
        service:
          type: string
          title: service
          minLength: 1
          description: Originating service name. Required.
        details:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: details
          description: Arbitrary details about the action.
        ipAddress:
          type: string
          title: ip_address
          description: IP address of the actor.
        userAgent:
          type: string
          title: user_agent
          description: User agent string.
        deviceId:
          type: string
          title: device_id
          description: Device ID from which the action was performed.
        targetProfileId:
          type: string
          title: target_profile_id
          description: Profile ID of the target user (optional).
        traceId:
          type: string
          title: trace_id
          description: OpenTelemetry trace ID for correlation (optional).
        entryId:
          type: string
          title: entry_id
          maxLength: 64
          description: Idempotency key unique per (tenant, service). Generated server-side when empty.
        onBehalfOf:
          type: string
          title: on_behalf_of
          maxLength: 50
          description: Person on whose behalf an operator or administrator acts (optional).
        occurredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: occurred_at
          description: When the action happened at the producer. Defaults to receipt time.
        correlationId:
          type: string
          title: correlation_id
          maxLength: 64
        eventId:
          type: string
          title: event_id
          maxLength: 64
        intentId:
          type: string
          title: intent_id
          maxLength: 64
        instanceId:
          type: string
          title: instance_id
          maxLength: 64
        payloadHash:
          type: string
          title: payload_hash
          pattern: ^([0-9a-f]{64})?$
          description: 32-byte lowercase hex digests (optional).
        authorizationHash:
          type: string
          title: authorization_hash
          pattern: ^([0-9a-f]{64})?$
        policyHash:
          type: string
          title: policy_hash
          pattern: ^([0-9a-f]{64})?$
        deviceKeyId:
          type: string
          title: device_key_id
          maxLength: 64
        stateFrom:
          type: string
          title: state_from
          maxLength: 64
        stateTo:
          type: string
          title: state_to
          maxLength: 64
        resourceVersion:
          type: string
          title: resource_version
          format: int64
        relations:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.AuditRelation'
          title: relations
          maxItems: 50
        phase:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditPhase'
          title: phase
          description: |-
            Phase of the command (GFOS §10.4, K11). When unset the service falls
             back to details["phase"] so a producer on the pre-K11 client still
             records the phase it already sends.
        outcomeOfEntryId:
          type: string
          title: outcome_of_entry_id
          maxLength: 64
          description: |-
            entry_id of the REQUESTED entry this entry is the outcome of. Required
             for a COMPLETED or FAILED outcome of an AUDIT_REQUIRED command; must be
             empty on a REQUESTED entry. Falls back to details["linked_entry_id"].
        auditClass:
          type: string
          title: audit_class
          maxLength: 32
          description: Producer audit class of the RPC. Falls back to details["class"].
        writtenDuringDegradation:
          type: boolean
          title: written_during_degradation
          description: |-
            True when the producer is draining an entry it parked locally while
             AUDIT_DEGRADED was declared. The entry keeps its original occurred_at
             and is recorded as written during degradation.
      title: CreateAuditEntryRequest
      additionalProperties: false
      description: |-
        CreateAuditEntryRequest creates a new audit entry.
         The hash chain and signature are computed server-side.
    audit.v1.CreateAuditEntryResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditEntryObject'
          title: data
          description: 'Deprecated: v2 returns the intake receipt; the chained entry is available via GetAuditEntry.'
          deprecated: true
        intakeId:
          type: string
          title: intake_id
          description: Identifier of the intake row holding the accepted entry.
        entryId:
          type: string
          title: entry_id
          description: Idempotency key (echoed or generated).
        state:
          allOf:
            - $ref: '#/components/schemas/audit.v1.IntakeState'
          title: state
          description: Always INTAKE_STATE_ACCEPTED on success, or the existing state for a duplicate.
      title: CreateAuditEntryResponse
      additionalProperties: false
    audit.v1.ExportAuditEntriesRequest:
      type: object
      properties:
        startSeq:
          type: string
          title: start_seq
          minimum: 0
          format: int64
        endSeq:
          type: string
          title: end_seq
          minimum: 0
          format: int64
      title: ExportAuditEntriesRequest
      additionalProperties: false
      description: ExportAuditEntriesRequest streams a verifiable bundle for a sequence range.
    audit.v1.ExportAuditEntriesResponse:
      type: object
      anyOf:
        - type: object
          properties:
            entry:
              allOf:
                - $ref: '#/components/schemas/audit.v1.AuditEntryObject'
              title: entry
          title: entry
        - type: object
          properties:
            header:
              allOf:
                - $ref: '#/components/schemas/audit.v1.ExportAuditEntriesResponse.Header'
              title: header
          title: header
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - entry
              - required:
                  - header
          - not:
              oneOf:
                - required:
                    - entry
                - required:
                    - header
      title: ExportAuditEntriesResponse
      description: |-
        ExportAuditEntriesResponse: the first message carries the bounding
         checkpoints and keys; subsequent messages carry entries in seq order.
    audit.v1.ExportAuditEntriesResponse.Header:
      type: object
      properties:
        tenantId:
          type: string
          title: tenant_id
        startSeq:
          type: string
          title: start_seq
          format: int64
        endSeq:
          type: string
          title: end_seq
          format: int64
        startCheckpoint:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditCheckpoint'
          title: start_checkpoint
          description: Checkpoint at or before start_seq (absent when starting from genesis).
        endCheckpoint:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditCheckpoint'
          title: end_checkpoint
          description: Checkpoint at or after end_seq, if any.
        keys:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.SigningKey'
          title: keys
      title: Header
      additionalProperties: false
    audit.v1.GetAuditEntryRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          minLength: 1
      title: GetAuditEntryRequest
      additionalProperties: false
      description: GetAuditEntryRequest retrieves a single audit entry by ID.
    audit.v1.GetAuditEntryResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditEntryObject'
          title: data
      title: GetAuditEntryResponse
      additionalProperties: false
    audit.v1.GetAuditManifestRequest:
      type: object
      properties:
        service:
          type: string
          title: service
          minLength: 1
      title: GetAuditManifestRequest
      additionalProperties: false
    audit.v1.GetAuditManifestResponse:
      type: object
      properties:
        manifest:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditManifest'
          title: manifest
        version:
          type: integer
          title: version
          format: int32
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: GetAuditManifestResponse
      additionalProperties: false
    audit.v1.GetSigningKeysRequest:
      type: object
      title: GetSigningKeysRequest
      additionalProperties: false
    audit.v1.GetSigningKeysResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.SigningKey'
          title: data
      title: GetSigningKeysResponse
      additionalProperties: false
    audit.v1.IntakeState:
      type: string
      title: IntakeState
      enum:
        - INTAKE_STATE_UNSPECIFIED
        - INTAKE_STATE_ACCEPTED
        - INTAKE_STATE_COMMITTED
        - INTAKE_STATE_FAILED
      description: IntakeState is the lifecycle of an accepted entry.
    audit.v1.ListAuditEntriesRequest:
      type: object
      properties:
        profileId:
          type: string
          title: profile_id
          description: Filter by profile ID of the actor.
        action:
          type: string
          title: action
          description: Filter by action type.
        resourceType:
          type: string
          title: resource_type
          description: Filter by resource type.
        resourceId:
          type: string
          title: resource_id
          description: Filter by resource ID.
        service:
          type: string
          title: service
          description: Filter by originating service.
        targetProfileId:
          type: string
          title: target_profile_id
          description: Filter by target profile ID.
        deviceId:
          type: string
          title: device_id
          description: Filter by device ID.
        startDate:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_date
          description: Filter entries created after this timestamp.
        endDate:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_date
          description: Filter entries created before this timestamp.
        count:
          type: integer
          title: count
          format: int32
          description: Maximum number of entries to return per page. Default 50, max 500.
        page:
          type: string
          title: page
          description: Pagination cursor (ID of the last entry from previous page).
        intentId:
          type: string
          title: intent_id
        eventId:
          type: string
          title: event_id
        correlationId:
          type: string
          title: correlation_id
        onBehalfOf:
          type: string
          title: on_behalf_of
        seqFrom:
          type: string
          title: seq_from
          format: int64
          description: Sequence range filters. When either is set, results are ordered by seq ascending.
        seqTo:
          type: string
          title: seq_to
          format: int64
        phase:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditPhase'
          title: phase
          description: Filter by phase (GFOS §10.4, K11).
        withoutOutcome:
          type: boolean
          title: without_outcome
          description: |-
            Return only REQUESTED entries that carry no linked outcome, i.e. the
             commands that read as "asked, not done".
        writtenDuringDegradationOnly:
          type: boolean
          title: written_during_degradation_only
          description: Filter by entries written while AUDIT_DEGRADED was declared.
      title: ListAuditEntriesRequest
      additionalProperties: false
      description: ListAuditEntriesRequest lists audit entries with filtering and pagination.
    audit.v1.ListAuditEntriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.AuditEntryObject'
          title: data
      title: ListAuditEntriesResponse
      additionalProperties: false
    audit.v1.ListCheckpointsRequest:
      type: object
      properties:
        seqFrom:
          type: string
          title: seq_from
          format: int64
        seqTo:
          type: string
          title: seq_to
          format: int64
        count:
          type: integer
          title: count
          format: int32
          description: Default 50, max 500.
      title: ListCheckpointsRequest
      additionalProperties: false
    audit.v1.ListCheckpointsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.AuditCheckpoint'
          title: data
      title: ListCheckpointsResponse
      additionalProperties: false
    audit.v1.RegisterAuditManifestRequest:
      type: object
      properties:
        manifest:
          allOf:
            - $ref: '#/components/schemas/audit.v1.AuditManifest'
          title: manifest
      title: RegisterAuditManifestRequest
      required:
        - manifest
      additionalProperties: false
    audit.v1.RegisterAuditManifestResponse:
      type: object
      properties:
        service:
          type: string
          title: service
        version:
          type: integer
          title: version
          format: int32
        unchanged:
          type: boolean
          title: unchanged
          description: True when the content matched the latest version and nothing was written.
      title: RegisterAuditManifestResponse
      additionalProperties: false
    audit.v1.RequeueIntakeRequest:
      type: object
      properties:
        intakeIds:
          type: array
          items:
            type: string
          title: intake_ids
          maxItems: 500
          minItems: 1
      title: RequeueIntakeRequest
      additionalProperties: false
      description: RequeueIntakeRequest moves FAILED intake rows back to ACCEPTED.
    audit.v1.RequeueIntakeResponse:
      type: object
      properties:
        requeued:
          type: string
          title: requeued
          format: int64
      title: RequeueIntakeResponse
      additionalProperties: false
    audit.v1.RetireSigningKeyRequest:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
          minLength: 1
      title: RetireSigningKeyRequest
      additionalProperties: false
    audit.v1.RetireSigningKeyResponse:
      type: object
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/audit.v1.SigningKey'
          title: key
      title: RetireSigningKeyResponse
      additionalProperties: false
    audit.v1.SearchAuditEntriesRequest:
      type: object
      properties:
        query:
          type: string
          title: query
          minLength: 1
          description: Free-text search query matching action, resource_type, resource_id, or details.
        startDate:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_date
          description: Filter entries created after this timestamp.
        endDate:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_date
          description: Filter entries created before this timestamp.
        count:
          type: integer
          title: count
          format: int32
          description: Maximum number of entries to return per page. Default 50, max 500.
        page:
          type: string
          title: page
          description: Pagination cursor.
      title: SearchAuditEntriesRequest
      additionalProperties: false
      description: SearchAuditEntriesRequest provides free-text search across audit entries.
    audit.v1.SearchAuditEntriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/audit.v1.AuditEntryObject'
          title: data
      title: SearchAuditEntriesResponse
      additionalProperties: false
    audit.v1.SigningKey:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
        algorithm:
          type: string
          title: algorithm
        publicKey:
          type: string
          title: public_key
          description: Hex-encoded public key.
        validFrom:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: valid_from
        retiredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: retired_at
      title: SigningKey
      additionalProperties: false
    audit.v1.VerifyIntegrityRequest:
      type: object
      properties:
        startDate:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_date
          description: Start of the time range to verify (resolved to start_seq when start_seq is 0).
        endDate:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_date
          description: End of the time range to verify (resolved to end_seq when end_seq is 0).
        startSeq:
          type: string
          title: start_seq
          format: int64
          description: First sequence number to verify (1 = genesis).
        endSeq:
          type: string
          title: end_seq
          format: int64
          description: Last sequence number to verify (0 = chain head).
      title: VerifyIntegrityRequest
      additionalProperties: false
      description: |-
        VerifyIntegrityRequest verifies the hash chain integrity over a sequence range.
         A date range is accepted as a convenience and resolved to sequence numbers.
    audit.v1.VerifyIntegrityResponse:
      type: object
      properties:
        valid:
          type: boolean
          title: valid
          description: Whether the hash chain is intact.
        entriesVerified:
          type: string
          title: entries_verified
          format: int64
          description: Total number of entries verified.
        firstInvalidEntryId:
          type: string
          title: first_invalid_entry_id
          description: ID of the first entry that failed verification (empty if valid).
        message:
          type: string
          title: message
          description: Human-readable description of the verification result.
        startCheckpointSeq:
          type: string
          title: start_checkpoint_seq
          format: int64
          description: Sequence of the checkpoint verification started from (0 = genesis).
        endSeq:
          type: string
          title: end_seq
          format: int64
          description: Last sequence number verified.
        endHash:
          type: string
          title: end_hash
          description: Entry hash at end_seq.
        keyIdsUsed:
          type: array
          items:
            type: string
          title: key_ids_used
          description: Signing keys encountered in the range.
        partial:
          type: boolean
          title: partial
          description: True when the range exceeded the per-call cap; continue from end_seq + 1.
        firstInvalidSeq:
          type: string
          title: first_invalid_seq
          format: int64
          description: Sequence of the first entry that failed verification (0 if valid).
      title: VerifyIntegrityResponse
      additionalProperties: false
      description: VerifyIntegrityResponse reports the result of integrity verification.
    base64:
      type: boolean
      examples:
        - false
      title: base64
      description: Specifies if the message query param is base64 encoded, which may be required for binary data
    compression:
      examples:
        - gzip
      title: compression
      enum:
        - identity
        - gzip
        - br
      description: Which compression algorithm to use for this request
    connect:
      examples:
        - v1
      title: connect
      enum:
        - v1
      description: Define the version of the Connect protocol
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
