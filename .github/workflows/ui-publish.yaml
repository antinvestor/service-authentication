name: Publish UI Flutter package to pub.dev

# ui/<package>/v<version> publishes ui/<package> through the shared
# antinvestor/common flutter-publish workflow (setup-dart OIDC token plus
# the Flutter SDK). auto-tag-packages.yaml dispatches this workflow on the
# tag it pushed, because a tag pushed with GITHUB_TOKEN does not trigger
# the push event.

on:
  push:
    tags:
      - 'ui/*/v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: antinvestor/common/.github/workflows/flutter-publish.yml@main
