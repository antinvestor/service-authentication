# Unified CI — handles both Go backend and Flutter UI (auto-detected)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    permissions:
      contents: read
      packages: read
    uses: antinvestor/common/.github/workflows/go-test.yml@main
    with:
      race: true
  lint:
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/golangci-lint.yml@main
  flutter:
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/flutter-ci.yml@main
    with:
      # ui/tenancy path-overrides sdk/dart/tenancy (protobuf 6) but still
      # pins protobuf ^4.2 and antinvestor_ui_core ^0.5. It moves after
      # antinvestor_ui_core 0.6.0; drop this exclude in that change.
      exclude: "ui/tenancy"
