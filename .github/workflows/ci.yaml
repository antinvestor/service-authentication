# Unified CI — handles both Go backend and Flutter UI (auto-detected)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    permissions:
      contents: read
      packages: read
    uses: antinvestor/common/.github/workflows/go-test.yml@main
    with:
      race: true
  lint:
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/golangci-lint.yml@main
  flutter:
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/flutter-ci.yml@main
    # ui/tenancy cannot resolve without its committed pubspec_overrides.yaml
    # (it needs antinvestor_api_tenancy ^2.0.0, unpublished; the override
    # points at sdk/dart/tenancy), so its publish dry-run fails until 2.0.0
    # is on pub.dev. The job stays red and visible; remove soft_fail then.
    with:
      soft_fail: true
