version: 2
updates:
  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 10
    # Auto-merge configuration
    allow:
      - dependency-type: "all"
    # Enable auto-merge for all dependency types
    labels:
      - "dependencies"
      - "auto-merge"
    reviewers:
      - "antinvestor/maintainers"
    assignees:
      - "antinvestor/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"
    # pitabwire/frame builds its OTel resource with a pinned semconv version;
    # an otel/sdk minor ahead of frame (different semconv schema URL) fails
    # every service start with "conflicting Schema URL". OTel (and
    # grpc-gateway, which drags it) must move together with frame bumps —
    # `go get frame@vX` raises them as needed; patches still flow here.
    ignore:
      - dependency-name: "go.opentelemetry.io/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "github.com/grpc-ecosystem/grpc-gateway/v2"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    # Group updates to reduce PR noise
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        update-types:
          - "major"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "auto-merge"
    commit-message:
      prefix: "ci"
      include: "scope"
